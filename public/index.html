<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#46178f">
<title>ReflexQ</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/common.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; color: #fff; text-align: center; }
  form { display: grid; gap: 12px; width: min(340px, 100%); }
  input { padding: 14px; border-radius: 6px; border: 0; font-size: 22px; font-weight: 800; text-align: center; }
  a { color: #fff; font-weight: 700; opacity: .85; }
</style>
</head>
<body class="bg-pattern">
  <span class="logo" style="font-size:40px"><img src="/icon-192.png" alt="" style="width:60px;height:60px">ReflexQ</span>
  <form action="/play" method="get">
    <input name="pin" inputmode="numeric" pattern="[0-9]*" placeholder="Game PIN" required>
    <button class="btn dark" style="font-size:20px;padding:14px">Join</button>
  </form>
  <a href="/host">I'm the teacher – open the quiz screen</a>
</body>
</html>
